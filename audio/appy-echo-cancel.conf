# HEARING-WORKAROUND(respeaker): echo-cancelled laptop mic for Appy, so the music playing
# through the speakers is (mostly) subtracted from what he hears. Temporary: delete once
# the ReSpeaker mic array is in (see docs/hearing-workaround.md).
# Installed by `bin/appy-echo-cancel install` into ~/.config/pipewire/pipewire.conf.d/.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            # Use whatever the default output is playing as the echo reference, so
            # nothing has to be rerouted through a special sink
            monitor.mode = true
            capture.props = {
                node.name = "appy_echo_cancel_capture"
                target.object = "alsa_input.pci-0000_00_1f.3.analog-stereo"
                node.passive = true
            }
            source.props = {
                node.name = "appy_echo_cancel_source"
                node.description = "Appy mic (echo-cancelled)"
            }
        }
    }
]
